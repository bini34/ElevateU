server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    # Allow post/message uploads (validation caps each file at 20 MB)
    client_max_body_size 100m;

    # Legacy private-chat files must never be served through the public symlink.
    # The API authorizes access and can read legacy files during migration.
    location ^~ /storage/uploads/messages/ {
        return 404;
    }

    location ^~ /uploads/messages/ {
        return 404;
    }

    # Handle API requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only Laravel's front controller may execute as PHP. Uploaded files
    # must never be forwarded to PHP-FPM.
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass laravel-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        return 404;
    }

    # Deny access to sensitive files
    location ~ /\.(env|ht) {
        deny all;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
