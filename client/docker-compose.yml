# Development compose for the client: runs the dev server against the
# API stack from ../server (which publishes ports on localhost).
# For production use the Dockerfile directly (standalone build).

services:
  nextjs-app:
    image: node:20-alpine
    container_name: ElevateU-Client
    working_dir: /app
    volumes:
      - .:/app
      # Keep container-built artifacts separate from the host's: node_modules
      # holds platform-specific binaries (Windows vs Linux), and a host .next
      # from `npm run build` corrupts the dev server's chunk resolution.
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080/api
      - NEXT_PUBLIC_REVERB_APP_KEY=${NEXT_PUBLIC_REVERB_APP_KEY:-ls7yo6wrxrmbtvuv86qo}
      - NEXT_PUBLIC_REVERB_HOST=localhost
      - NEXT_PUBLIC_REVERB_PORT=6001
      - NEXT_PUBLIC_REVERB_SCHEME=http
