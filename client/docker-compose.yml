# Development compose for the client: runs the dev server against the
# API stack from ../server (which publishes ports on localhost).
# For production use the Dockerfile directly (standalone build).

services:
  nextjs-app:
    image: node:22.23.2-alpine3.24@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
    container_name: ElevateU-Client
    working_dir: /app
    volumes:
      - .:/app
      # Keep container-built artifacts separate from the host's: node_modules
      # holds platform-specific binaries (Windows vs Linux), and a host .next
      # from `npm run build` corrupts the dev server's chunk resolution.
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "npm ci && npm run dev"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080/api}
      # localhost:8080 is reachable by the browser, not this container. Serve
      # originals locally, or set false with an API origin reachable by both
      # browser and container and a matching server APP_URL.
      - ELEVATEU_UNOPTIMIZED_IMAGES=${ELEVATEU_UNOPTIMIZED_IMAGES:-true}
      - NEXT_PUBLIC_REVERB_APP_KEY=${NEXT_PUBLIC_REVERB_APP_KEY:-}
      - NEXT_PUBLIC_REVERB_HOST=localhost
      - NEXT_PUBLIC_REVERB_PORT=6001
      - NEXT_PUBLIC_REVERB_SCHEME=http
